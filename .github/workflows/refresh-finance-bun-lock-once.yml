name: One-time finance PDF Bun lock refresh

on:
  push:
    branches:
      - feat/finance-document-pdf-20261015

permissions:
  contents: write

jobs:
  refresh-bun-lock:
    if: github.repository == 'Aghbari-Technologies/aghbari-commerce-evolved' && github.ref == 'refs/heads/feat/finance-document-pdf-20261015'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted finance PDF branch
        uses: actions/checkout@v4
        with:
          ref: feat/finance-document-pdf-20261015
          persist-credentials: true
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Regenerate canonical Bun lockfile without running package scripts
        run: bun install --lockfile-only --ignore-scripts
      - name: Commit only the regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile already matches package.json."
            exit 0
          fi
          git diff --stat -- bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lock for finance PDF dependencies"
          git push origin "HEAD:feat/finance-document-pdf-20261015"
